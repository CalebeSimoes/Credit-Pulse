version: "2.0"
database_dialect: sqlite
description: "Camada semântica oficial do CreditPulse (BCB/SGS - Constellation Schema)."

tables:
  fato_indicadores_credito:
    alias: f
    grain: "1 linha por data_ref e id_modalidade"
    columns:
      data_ref:
        type: TEXT
        role: time
        label: "Data de Referência"
      id_modalidade:
        type: INTEGER
        role: key
        label: "ID Modalidade"
      taxa_juros_anual:
        type: REAL
        role: metric
        metric_type: rate
        unit: "% a.a."
        diff_unit: "p.p."
        label: "Taxa de Juros (% a.a.)"
      taxa_inadimplencia_90d:
        type: REAL
        role: metric
        metric_type: rate
        unit: "%"
        diff_unit: "p.p."
        label: "Inadimplência >90d (%)"
      volume_concessoes_milhoes:
        type: REAL
        role: metric
        metric_type: flow
        unit: "R$ milhões"
        diff_unit: "R$ mi"
        label: "Volume de Concessões (R$ milhões)"
      saldo_carteira_milhoes:
        type: REAL
        role: metric
        metric_type: stock
        unit: "R$ milhões"
        diff_unit: "R$ mi"
        label: "Saldo da Carteira (R$ milhões)"

  fato_macro_mensal:
    alias: fm
    grain: "1 linha por data_ref"
    columns:
      data_ref:
        type: TEXT
        role: time
        label: "Data de Referência"
      taxa_selic_meta:
        type: REAL
        role: metric
        metric_type: rate
        unit: "% a.a."
        diff_unit: "p.p."
        label: "Selic Meta (% a.a.)"
      ipca_mensal:
        type: REAL
        role: metric
        metric_type: rate
        unit: "%"
        diff_unit: "p.p."
        label: "IPCA Mensal (%)"

  dim_modalidades:
    alias: m
    columns:
      id_modalidade:
        type: INTEGER
        role: key
      nome_modalidade:
        type: TEXT
        role: dimension
        label: "Modalidade de Crédito"
        allowed_values:
          - "Crédito Pessoal Não Consignado PF"
          - "Crédito Pessoal Consignado Total PF"
          - "Aquisição de Veículos PF"
          - "Capital de Giro Total PJ"
      segmento:
        type: TEXT
        role: dimension
        label: "Segmento"
        allowed_values: ["PF", "PJ"]
      tipo_recurso:
        type: TEXT
        role: dimension
        label: "Tipo de Recurso"
        allowed_values: ["Livre"]

  dim_tempo:
    alias: t
    columns:
      data_ref:
        type: TEXT
        role: time
        label: "Data de Referência"
      ano:
        type: INTEGER
        role: time
        label: "Ano"
      mes:
        type: INTEGER
        role: time_part
        label: "Mês"
      trimestre:
        type: INTEGER
        role: time_part
        label: "Trimestre"
      semestre:
        type: INTEGER
        role: time_part
        label: "Semestre"

relationships:
  - from: fato_indicadores_credito.data_ref
    to: dim_tempo.data_ref
  - from: fato_indicadores_credito.id_modalidade
    to: dim_modalidades.id_modalidade
  - from: fato_macro_mensal.data_ref
    to: dim_tempo.data_ref
  - from: fato_indicadores_credito.data_ref
    to: fato_macro_mensal.data_ref

metrics:
  juros_medio_ponderado:
    sql: "SUM(f.taxa_juros_anual * f.volume_concessoes_milhoes) / NULLIF(SUM(f.volume_concessoes_milhoes), 0)"
    metric_type: rate
    unit: "% a.a."
    diff_unit: "p.p."
    label: "Juros Médio Ponderado (% a.a.)"
  inadimplencia_media_ponderada:
    sql: "SUM(f.taxa_inadimplencia_90d * f.saldo_carteira_milhoes) / NULLIF(SUM(f.saldo_carteira_milhoes), 0)"
    metric_type: rate
    unit: "%"
    diff_unit: "p.p."
    label: "Inadimplência Ponderada pelo Saldo (%)"
  volume_total_concessoes:
    sql: "SUM(f.volume_concessoes_milhoes)"
    metric_type: flow
    unit: "R$ milhões"
    diff_unit: "R$ mi"
    label: "Volume Total de Concessões (R$ milhões)"
  saldo_total_carteira:
    sql: "SUM(f.saldo_carteira_milhoes)"
    metric_type: stock
    unit: "R$ milhões"
    diff_unit: "R$ mi"
    label: "Saldo Total da Carteira (R$ milhões)"

business_rules:
  - "Para perguntas EXCLUSIVAMENTE sobre Selic ou IPCA, consulte diretamente fato_macro_mensal fm (sem JOIN em fato_indicadores_credito)."
  - "NUNCA use SUM() em taxas percentuais (taxa_juros_anual, taxa_inadimplencia_90d, taxa_selic_meta, ipca_mensal)."
  - "saldo_carteira_milhoes e indicador de ESTOQUE: pode ser somado entre modalidades no mesmo mes, mas NUNCA somado ao longo de varios meses (para resumo anual de saldo, use AVG ou o ultimo mes do ano)."
  - "volume_concessoes_milhoes e indicador de FLUXO: pode ser somado ao longo do tempo e entre modalidades."
  - "Para consolidar juros entre modalidades, pondere por volume_concessoes_milhoes. Para consolidar inadimplencia entre modalidades, pondere por saldo_carteira_milhoes."
  - "Para filtrar o ultimo mes disponivel de credito, SEMPRE use f.data_ref = (SELECT MAX(data_ref) FROM fato_indicadores_credito). Para macro, use fm.data_ref = (SELECT MAX(data_ref) FROM fato_macro_mensal). NUNCA use MAX(mes)."